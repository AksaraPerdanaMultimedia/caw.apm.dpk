<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controlling WO APM SO Depok</title>
<style>
:root{--bg:#0b1d26;--c:#12303d;--c2:#17404f;--t:#e6f1f4;--m:#8fb0ba;--a:#2dd4bf;--p:#f59e0b;--r:#f43f5e;--g:#22c55e}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 'Segoe UI',system-ui,sans-serif;background:radial-gradient(circle at 20% 0,#14424f,#0b1d26 60%) fixed;color:var(--t);min-height:100vh}
.hide{display:none!important}button,input,select{font:inherit;color:inherit}
#login{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}
.box{background:var(--c);padding:28px;border-radius:16px;max-width:400px;width:100%;box-shadow:0 20px 60px #0009;animation:rise .7s both}
.box h2{margin:0 0 6px;font-size:20px;line-height:1.3}.box p{margin:0 0 16px;color:var(--m)}
input,select{width:100%;padding:11px 12px;margin-bottom:10px;border-radius:10px;border:1px solid #2b5666;background:#0e2631}
.pri{width:100%;padding:11px;border:0;border-radius:10px;background:var(--a);color:#032;font-weight:700;cursor:pointer}
#err{color:var(--r);margin-top:8px;min-height:18px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 18px;background:#0b1d26cc;position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
nav button,header>button{padding:8px 14px;border-radius:999px;border:1px solid #2b5666;background:none;cursor:pointer}
nav button.on{background:var(--a);color:#032;border-color:var(--a);font-weight:700}
main{padding:16px;max-width:1200px;margin:auto}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--c);border:2px solid transparent;border-radius:14px;padding:14px;text-align:left;display:block}
.card b{display:block;font-size:34px;margin-top:4px}
.sel{cursor:pointer;transition:.25s}.sel:hover{transform:translateY(-3px);border-color:#2b5666}
#c1.on{border-color:var(--p);box-shadow:0 0 22px #f59e0b55}#c1 b{color:var(--p)}
#c2.on{border-color:var(--r);box-shadow:0 0 22px #f43f5e55}#c2 b{color:var(--r)}
.g2{display:grid;grid-template-columns:290px 1fr;gap:14px}@media(max-width:820px){.g2{grid-template-columns:1fr}}
.cw{background:var(--c);border-radius:14px;padding:12px;align-self:start}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ch button{background:var(--c2);border:0;border-radius:8px;width:30px;height:30px;cursor:pointer}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.cg i{color:var(--m);font-style:normal;font-size:12px}
.d{aspect-ratio:1;border:0;border-radius:8px;background:none;cursor:pointer;position:relative}.d:hover{background:var(--c2)}
.d.on{background:var(--a);color:#032;font-weight:700}.d.dot:after{content:'';position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--p)}
.rs{width:100%;margin:8px 0 0;padding:8px;border:1px solid #2b5666;border-radius:8px;background:none;cursor:pointer}
#rng{color:var(--m);font-size:12px;margin-top:6px}
.tw{overflow-x:auto;background:var(--c);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:9px 11px;text-align:left;border-bottom:1px solid #1f4757;vertical-align:top}
th{background:var(--c2);position:sticky;top:0}
.empty{padding:26px;text-align:center;color:var(--m)}
.bd{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.bp{background:#f59e0b33;color:var(--p)}.bc{background:#f43f5e33;color:var(--r)}
tr.h2 td{background:#facc1526}tr.h1 td{background:#f43f5e33}
.tag{padding:2px 8px;border-radius:6px;font-weight:700;font-size:12px;white-space:nowrap}
.h2 .tag{background:#facc15;color:#320}.h1 .tag{background:var(--r);color:#fff;animation:pulse 1s infinite}
#rem{margin-bottom:14px}.rm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;margin-bottom:6px;border-radius:10px;border-left:5px solid;animation:bounce .8s both}
.rm.h2{background:#facc1522;border-color:#facc15}.rm.h1{background:#f43f5e2e;border-color:var(--r)}
/* transisi berbeda tiap pilihan */
.a-p{animation:wipe .7s both}.a-p tbody tr{animation:inL .55s both}
.a-c{animation:flip .7s both;transform-origin:top}.a-c tbody tr{animation:zoom .5s both}
.k tbody tr{animation:rise .5s both}
.ar{font-weight:900;margin-left:6px}.up{color:var(--g)}.dn{color:var(--r)}
tr.hi td{background:#22c55e1a}tr.lo td{background:#f43f5e1a}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
@keyframes inL{from{opacity:0;transform:translateX(-60px)}}
@keyframes flip{from{opacity:0;transform:perspective(700px) rotateX(-70deg)}}
@keyframes zoom{from{opacity:0;transform:scale(.6) rotate(-4deg)}}
@keyframes bounce{0%{opacity:0;transform:translateY(-30px)}60%{transform:translateY(6px)}}
@keyframes pulse{50%{opacity:.55}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div id="login"><div class="box"><h2>Selamat datang, ini adalah controlling data Workorder APM SO Depok</h2><p>Silahkan Login</p>
<input id="u" placeholder="ID Karyawan" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()">
<button class="pri" onclick="login()">Login</button><div id="err"></div></div></div>
<div id="app" class="hide">
<header><b>Controlling WO APM SO Depok</b><nav><button id="t1" class="on" onclick="tab(1)">Work Order</button> <button id="t2" onclick="tab(2)">Rekap KPI Bulanan</button></nav><button onclick="out()">Keluar</button></header>
<main>
<section id="s1"><div id="rem"></div>
<div class="g"><div class="card">Total Work Order<b id="n0">0</b></div>
<button class="card sel" id="c1" onclick="selS('p')">Pending<b id="n1">0</b></button>
<button class="card sel" id="c2" onclick="selS('c')">Cancel<b id="n2">0</b></button></div>
<div class="g2"><div class="cw"><div id="cal"></div><button class="rs" onclick="clr()">Reset tanggal</button><div id="rng"></div></div><div id="det"><div class="empty">Pilih Pending atau Cancel untuk melihat detail Work Order.</div></div></div></section>
<section id="s2" class="hide"><select id="per" onchange="kpi()"></select><div id="kt" class="tw"></div></section>
</main></div>
<script>
const API='https://script.google.com/macros/s/AKfycbzoMFPqXTMNUapk4RKuVGCiD8IbXiHzHb_ALLSFN4yaBUn9uU0BKTpnT1MGwurkQmuS/exec'; // URL deployment Apps Script (berakhiran /exec)
const $=id=>document.getElementById(id),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const MI={jan:0,feb:1,mar:2,apr:3,mei:4,may:4,jun:5,jul:6,agu:7,aug:7,sep:8,okt:9,oct:9,nov:10,des:11,dec:11};
let W=[],K={},sel=null,from=null,to=null,cal=new Date(),marks={},cred=null,tmr;
const T0=(()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()})();
function dates(s){const r=[],Y=new Date().getFullYear();let m;
 const a=/(\d{1,2})\s+([A-Za-z]{3,9})\.?(?:\s+(\d{4}))?/g;
 while(m=a.exec(s)){const k=MI[m[2].slice(0,3).toLowerCase()];if(k!==undefined&&m[1]<=31)r.push(new Date(m[3]?+m[3]:Y,k,+m[1]).getTime())}
 const b=/(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?/g;
 while(m=b.exec(s)){if(m[1]<=31&&m[2]>=1&&m[2]<=12){let y=m[3]?+m[3]:Y;if(y<100)y+=2000;r.push(new Date(y,m[2]-1,+m[1]).getTime())}}
 return r}
const st=s=>/pend/i.test(s)?'p':/cancel|batal/i.test(s)?'c':/complete|selesai/i.test(s)?'ok':'x';
const fmt=t=>{const d=new Date(t);return d.getDate()+' '+MN[d.getMonth()]+' '+d.getFullYear()};
async function load(u,p){const r=await fetch(API,{method:'POST',body:JSON.stringify({u,p})});return r.json()}
async function login(){$('err').textContent='';const u=$('u').value.trim(),p=$('p').value;
 try{const d=await load(u,p);if(!d.ok){$('err').textContent=d.msg||'Gagal login';return}
 cred={u,p};sessionStorage.wo=JSON.stringify(cred);start(d)}catch(e){$('err').textContent='Tidak dapat terhubung ke server. Periksa URL API.'}}
function start(d){$('login').classList.add('hide');$('app').classList.remove('hide');ingest(d);clearInterval(tmr);
 tmr=setInterval(async()=>{try{const x=await load(cred.u,cred.p);if(x.ok)ingest(x)}catch(e){}},120000)}
function out(){sessionStorage.removeItem('wo');location.reload()}
function ingest(d){W=d.wo.slice(1).filter(r=>r[1]).map(r=>({wo:r[1],tg:r[2],t:(dates(r[2])[0]||0),tk:r[3],pl:r[4],al:r[5],st:r[6],s:st(r[6]),kd:r[7],rm:r[8]}));
 marks={};W.forEach(r=>{if(r.s=='p'||r.s=='c')marks[r.t]=1});K=parseK(d.kpi);
 const ks=Object.keys(K),cur=$('per').value;$('per').innerHTML=ks.map(k=>'<option>'+E(k)+'</option>').join('');$('per').value=ks.includes(cur)?cur:ks[ks.length-1];
 reminders();render();kpi()}
function parseK(v){const P={};let c=null;for(const r of v){const a=(r[0]||'').trim();
 if(/^BULAN\s/i.test(a)){c=a.replace(/^BULAN\s+/i,'');P[c]=[]}else if(c&&a&&r[1]&&!/^ID\s/i.test(a)&&/\d/.test(r[3]))P[c].push(r)}return P}
function tab(n){$('s1').classList.toggle('hide',n!=1);$('s2').classList.toggle('hide',n!=2);$('t1').classList.toggle('on',n==1);$('t2').classList.toggle('on',n==2);if(n==2)kpi()}
const inR=r=>!from||(r.t>=from&&r.t<=(to||from));
function selS(x){sel=sel==x?null:x;render()}
function render(){const f=W.filter(inR),P=f.filter(r=>r.s=='p'),C=f.filter(r=>r.s=='c');
 $('n0').textContent=f.length;$('n1').textContent=P.length;$('n2').textContent=C.length;
 $('c1').classList.toggle('on',sel=='p');$('c2').classList.toggle('on',sel=='c');
 $('rng').textContent=from?'Tanggal: '+fmt(from)+(to&&to!=from?' – '+fmt(to):''):'Semua tanggal';
 drawCal();const L=sel=='p'?P:sel=='c'?C:null;
 if(!L){$('det').innerHTML='<div class="empty">Pilih Pending atau Cancel untuk melihat detail Work Order.</div>';return}
 const rr=rowRem();
 $('det').innerHTML='<div class="tw a-'+sel+'"><table><thead><tr><th>Work Order</th><th>Tanggal Install</th><th>Teknisi</th><th>Pelanggan</th><th>Alamat</th><th>Status</th><th>Kendala</th><th>Remark</th></tr></thead><tbody>'+
 (L.map((r,i)=>{const h=rr.get(r),b=sel=='p'?'bp':'bc';
 return '<tr class="'+(h?h.l:'')+'" style="animation-delay:'+Math.min(i,25)*35+'ms"><td>'+E(r.wo)+'</td><td>'+E(r.tg)+'</td><td>'+E(r.tk)+'</td><td>'+E(r.pl)+'</td><td>'+E(r.al)+'</td><td><span class="bd '+b+'">'+E(r.st)+'</span>'+(h?' <span class="tag">'+h.l.toUpperCase().replace('H','H-')+'</span>':'')+'</td><td>'+E(r.kd)+'</td><td>'+E(r.rm)+'</td></tr>'}).join('')||'<tr><td colspan="8" class="empty">Tidak ada data pada rentang tanggal ini.</td></tr>')+'</tbody></table></div>'}
// Pengingat: tanggal mendatang pada Kendala/Remark (dan tanggal install untuk Pending): H-2 kuning, H-1 merah
function rowRem(){const m=new Map();for(const r of W){if(r.s=='ok')continue;let ds=dates((r.kd||'')+' '+(r.rm||''));if(r.s=='p'&&r.t)ds.push(r.t);
 let best=0;for(const t of ds){const d=Math.round((t-T0)/864e5);if(d==1||d==2)best=best?Math.min(best,d):d}
 if(best)m.set(r,{l:'h'+best,d:best})}return m}
function reminders(){const L=[...rowRem()].sort((a,b)=>a[1].d-b[1].d);
 $('rem').innerHTML=L.map(([r,h])=>'<div class="rm '+h.l+'"><span class="tag">H-'+h.d+'</span><b>'+E(r.wo)+'</b> '+E(r.pl)+' · '+E(r.tk)+' · '+E(r.st)+(r.kd?' · '+E(r.kd):'')+(r.rm?' · '+E(r.rm):'')+'</div>').join('')}
// Kalender
function mv(n){cal=new Date(cal.getFullYear(),cal.getMonth()+n,1);drawCal()}
function pick(t){if(!from||to){from=t;to=null}else{to=Math.max(t,from);from=Math.min(t,from)}render()}
function clr(){from=to=null;render()}
function drawCal(){const y=cal.getFullYear(),m=cal.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
 let h='<div class="ch"><button onclick="mv(-1)">‹</button><b>'+MN[m]+' '+y+'</b><button onclick="mv(1)">›</button></div><div class="cg">'+['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(d=>'<i>'+d+'</i>').join('');
 for(let i=0;i<f;i++)h+='<span></span>';
 for(let d=1;d<=n;d++){const t=new Date(y,m,d).getTime(),on=from&&t>=from&&t<=(to||from);h+='<button class="d'+(on?' on':'')+(marks[t]?' dot':'')+'" onclick="pick('+t+')">'+d+'</button>'}
 $('cal').innerHTML=h+'</div>'}
// KPI
function kpi(){const R=K[$('per').value]||[];if(!R.length){$('kt').innerHTML='<div class="empty">Belum ada data periode ini.</div>';return}
 const v=r=>parseFloat(String(r[6]).replace('%','').replace(',','.'))||0,vs=R.map(v),mx=Math.max(...vs),mn=Math.min(...vs);
 $('kt').innerHTML='<table class="k"><thead><tr><th>ID Karyawan</th><th>Nama Karyawan</th><th>Target Bulanan</th><th>Realisasi Pemasangan</th><th>Target Harian</th><th>Realisasi Harian</th><th>% Pencapaian</th><th>Predikat</th></tr></thead><tbody>'+
 R.map((r,i)=>{const x=vs[i],c=x==mx?'hi':x==mn?'lo':'',a=x==mx?'<span class="ar up" title="Poin tertinggi">▲</span>':x==mn?'<span class="ar dn" title="Poin terendah">▼</span>':'';
 return '<tr class="'+c+'" style="animation-delay:'+Math.min(i,25)*30+'ms">'+[0,1,2,3,4,5,6,7].map(j=>'<td>'+E(r[j])+(j==1?a:'')+'</td>').join('')+'</tr>'}).join('')+'</tbody></table>'}
if(sessionStorage.wo){try{cred=JSON.parse(sessionStorage.wo);load(cred.u,cred.p).then(d=>{if(d.ok)start(d)})}catch(e){}}
</script></body></html>
